{% extends 'base.html' %}

{% block content %}

<div class="page-header">
    <div>
        <h1>{{ 'Edit Buku' if mode == 'edit' else 'Tambah Buku' }}</h1>
        <p>{{ 'Perbarui data buku perpustakaan.' if mode == 'edit' else 'Masukkan data buku baru.' }}</p>
    </div>
</div>

<div class="form-card">

    <form method="POST">

        <label for="id_buku">ID Buku</label>
        <input type="text"
               id="id_buku"
               name="id_buku"
               value="{{ data.id_buku if mode == 'edit' else '' }}"
               {% if mode == 'edit' %}readonly{% endif %}
               required>

        <label for="judul">Judul Buku</label>
        <input type="text"
               id="judul"
               name="judul"
               value="{{ data.judul if mode == 'edit' else '' }}"
               required>

        <label for="pengarang">Pengarang</label>
        <input type="text"
               id="pengarang"
               name="pengarang"
               value="{{ data.pengarang if mode == 'edit' else '' }}"
               required>

        <label for="penerbit">Penerbit</label>
        <input type="text"
               id="penerbit"
               name="penerbit"
               value="{{ data.penerbit if mode == 'edit' and data.penerbit else '' }}">

        <label for="tahun_terbit">Tahun Terbit</label>
        <input type="number"
               id="tahun_terbit"
               name="tahun_terbit"
               value="{{ data.tahun_terbit if mode == 'edit' and data.tahun_terbit else '' }}">

        <label for="stok">Stok</label>
        <input type="number"
               id="stok"
               name="stok"
               min="0"
               value="{{ data.stok if mode == 'edit' else 0 }}"
               required>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {{ 'Simpan Perubahan' if mode == 'edit' else 'Tambah Buku' }}
            </button>

            <a href="{{ url_for('buku.index') }}"
               class="btn btn-light">
                Batal
            </a>
        </div>

    </form>

</div>

{% endblock %}
